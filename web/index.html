<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Arjun Jai - Flutter Developer Portfolio. Showcasing my projects, skills, and experience.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arjun Jai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #000000;
      /* Match app background to avoid flash */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    .loading-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9999;
    }

    .loader {
      border: 4px solid rgba(0, 255, 255, 0.2);
      /* Cyan faint */
      border-top: 4px solid #00FFFF;
      /* Cyan sharp */
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      color: #00FFFF;
      font-size: 14px;
      letter-spacing: 2px;
      animation: blink 1.5s infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }
  </style>
</head>

<body>
  <div class="loading-container" id="app-loader">
    <div class="loader"></div>
    <div class="loading-text">INITIALIZING...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeLoader() {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.transition = 'opacity 0.5s';
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader.parentNode) loader.remove();
        }, 500);
      }
    }

    // 1. Polling: Check every 200ms if Flutter has drawn anything (canvas or specific tags)
    const interval = setInterval(() => {
      if (document.querySelector('flt-glass-pane') ||
        document.querySelector('flutter-view') ||
        document.querySelector('canvas')) {
        removeLoader();
        clearInterval(interval);
      }
    }, 200);

    // 2. Event Listener: Some Flutter versions dispatch this
    window.addEventListener('flutter-first-frame', removeLoader);

    // 3. Absolute Safety Net: Remove after 3.5 seconds no matter what
    setTimeout(removeLoader, 3500);
  </script>
</body>

</html>
